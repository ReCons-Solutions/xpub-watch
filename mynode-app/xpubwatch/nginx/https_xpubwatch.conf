server {
    listen 5115;
    server_name _;

    return 302 https://$host:5116$request_uri;
}

server {
    listen 5116 ssl;
    server_name xpubwatch;

    include /etc/nginx/mynode/mynode_ssl_params.conf;
    include /etc/nginx/mynode/mynode_ssl_cert_key.conf;

    access_log /var/log/nginx/access_xpubwatch.log;
    error_log /var/log/nginx/error_xpubwatch.log;

    location / {
        proxy_pass http://127.0.0.1:5114;
        include /etc/nginx/mynode/mynode_ssl_proxy_params.conf;
        # Client address for login throttling (custom name avoids clashing with MyNode defaults).
        proxy_set_header X-XPUBWatch-Client-IP $remote_addr;
    }
}
