<label>{{ label }}{% if secrets_set[key] %} <span class="badge">configured</span>{% endif %}
  <input type="password" name="{{ key }}" value="" autocomplete="new-password" placeholder="{{ 'leave empty to keep the stored value' if secrets_set[key] else '' }}">
</label>
{% if secrets_set[key] %}<label class="check"><input type="checkbox" name="clear_{{ key }}" value="1"> Remove stored {{ label }}</label>{% endif %}
